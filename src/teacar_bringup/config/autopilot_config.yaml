gscam_node:
  ros__parameters:
    # Match collect_config.yaml; nn_controller crops the top 80 rows for the model.
    camera_resolution: [1280, 720]
    framerate: 30
    image_resolution: [224, 224]
    rotate: 180
    format: "BGRx"

joy_node:
  ros__parameters:
    dev: "/dev/input/js0"

joystick_controller_node:
  ros__parameters:
    # Joystick Ratio Settings
    throttle_ratio: 0.6
    steer_ratio: 0.0  # Steering comes from the CNN; the joystick controls throttle only.
    # Joystick Channel Setting
    throttle_axis: 4
    steer_axis: 6

nn_controller_node:
  ros__parameters:
    steer_ratio: 1.0
    # Loads libtensorrt_inferencer.so (or tensorflow for libtensorflow_inferencer.so)
    backend: "tensorrt"
    # model_file is set by the model_file argument of autopilot.launch.py
    input_name: "image"
    output_name: "steer"
    # Model input is 224x144: the 224x224 camera image without its top 80 rows
    roi:
      x: 0
      y: 80
      width: 224
      height: 144

pca9685_actuator_node:
  ros__parameters:
    # PWM Frequency and Bus Configuration
    bus_device: "/dev/i2c-7"
    pwm_frequency: 60

    # Throttle Configuration
    throttle_pwm_channel: 0
    throttle_min_pulsewidth: 1000
    throttle_max_pulsewidth: 2000
    throttle_mid_pulsewidth: 1500

    # Steer Configuration
    steer_pwm_channel: 1
    steer_min_pulsewidth: 1200
    steer_max_pulsewidth: 2000
    steer_mid_pulsewidth: 1600
