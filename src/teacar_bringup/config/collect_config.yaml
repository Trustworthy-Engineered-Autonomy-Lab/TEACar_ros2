gscam_node:
  ros__parameters:
    camera_resolution: [1280, 720]
    frame_rate: 30
    image_resolution: [224, 224]
    rotate: 180
    format: "BGRx"

joy_node:
  ros__parameters:
    dev: "/dev/input/js0"

joystick_controller_node:
  ros__parameters:
    # Joystick Ratio Settings
    throttle_ratio: 0.6
    steer_ratio: -1.0
    # Logitech F710 with MODE swapping the left stick and D-pad.
    # Keep the current MODE setting; axis indices are zero-based.
    throttle_axis: 4  # Right stick vertical: forward / reverse
    steer_axis: 6     # Left stick horizontal: left / right (7th of 8 axes)

pca9685_actuator_node:
  ros__parameters:
    # PWM Frequency and Bus Configuration
    bus_device: "/dev/i2c-7"
    pwm_frequency: 60

    # Throttle Configuration
    throttle_pwm_channel: 0
    throttle_min_pulsewidth: 1000
    throttle_max_pulsewidth: 2000
    throttle_mid_pulsewidth: 1500

    # Steer Configuration
    steer_pwm_channel: 1
    steer_min_pulsewidth: 1200
    steer_max_pulsewidth: 2000
    steer_mid_pulsewidth: 1600

recorder_node:
  ros__parameters:
    data_folder: "/home/nvidia/TEAcar_ros2/data/collect_%Y_%m_%d_%H_%M_%S"
    downsample_rate: 2
    record_button: 5
    
